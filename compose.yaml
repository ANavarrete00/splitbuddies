
services:
  splitbuddies:
    build:
      context: .
    image: splitbuddies:local
    container_name: splitbuddies
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${APP_PORT:-3000}
      DATABASE_PATH: /data/splitbuddies.sqlite
      TRUST_PROXY: ${TRUST_PROXY:-}

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-5274}:${APP_PORT:-3000}"

    volumes:
      - splitbuddies_data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  splitbuddies_data:
